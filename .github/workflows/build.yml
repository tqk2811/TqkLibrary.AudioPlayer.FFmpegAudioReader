name: build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  NATIVE_SRC: src/TqkLibrary.AudioPlayer.FFmpegAudioReader.Native
  LIB_PROJ: src/TqkLibrary.AudioPlayer.FFmpegAudioReader/TqkLibrary.AudioPlayer.FFmpegAudioReader.csproj
  TEST_PROJ: src/ConsoleTest/ConsoleTest.csproj

jobs:
  # ---------------------------------------------------------------------------
  # Build the native wrapper for every RID, linking against the matching
  # TqkLibrary.FFmpeg.Native.<RID> package (headers + import libs / .so).
  # ---------------------------------------------------------------------------
  native:
    name: native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, pkgid: TqkLibrary.FFmpeg.Native.Win.x64,     ffver: 8.0.1.48 }
          - { rid: win-x86,     os: windows-latest, pkgid: TqkLibrary.FFmpeg.Native.Win.x86,     ffver: 8.0.1.48 }
          - { rid: win-arm64,   os: windows-latest, pkgid: TqkLibrary.FFmpeg.Native.Win.arm64,   ffver: 8.0.1.48 }
          - { rid: linux-x64,   os: ubuntu-latest,  pkgid: TqkLibrary.FFmpeg.Native.Linux.x64,   ffver: 8.0.1.48 }
          - { rid: linux-arm64, os: ubuntu-latest,  pkgid: TqkLibrary.FFmpeg.Native.Linux.arm64, ffver: 8.0.1.49 }
    steps:
      - uses: actions/checkout@v4

      - name: Build native (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $arch = $rid.Substring(4)                                  # x64 / x86 / arm64
          $vsArch = @{ 'x64' = 'x64'; 'x86' = 'Win32'; 'arm64' = 'ARM64' }[$arch]
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/${{ matrix.pkgid }}/${{ matrix.ffver }}" -OutFile pkg.zip
          Expand-Archive pkg.zip -DestinationPath pkg -Force
          cmake -A $vsArch `
            -DFFMPEG_INCLUDE_DIR="pkg/build/native/include" `
            -DFFMPEG_LIB_DIR="pkg/build/native/win/$arch/lib" `
            -S "$env:NATIVE_SRC" -B nbuild
          cmake --build nbuild --config Release
          $dst = "native-out/runtimes/$rid/native"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Get-ChildItem nbuild/Release -Filter *.Native.dll | Copy-Item -Destination $dst -Force
          Get-ChildItem nbuild/Release -Filter *.Native.pdb -ErrorAction SilentlyContinue | Copy-Item -Destination $dst -Force
          Get-ChildItem -Recurse $dst

      - name: Build native (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          ARCH="${RID#linux-}"                                       # x64 / arm64
          TOOLCHAIN=""
          if [ "$ARCH" = "arm64" ]; then
            sudo apt-get update
            sudo apt-get install -y g++-aarch64-linux-gnu
            TOOLCHAIN="-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++"
          fi
          curl -sSL "https://www.nuget.org/api/v2/package/${{ matrix.pkgid }}/${{ matrix.ffver }}" -o pkg.zip
          mkdir pkg && (cd pkg && unzip -q ../pkg.zip)
          cmake $TOOLCHAIN -DCMAKE_BUILD_TYPE=Release \
            -DFFMPEG_INCLUDE_DIR="pkg/build/native/include" \
            -DFFMPEG_RUNTIME_DIR="pkg/runtimes/$RID/native" \
            -S "$NATIVE_SRC" -B nbuild
          cmake --build nbuild --config Release
          DST="native-out/runtimes/$RID/native"
          mkdir -p "$DST"
          cp nbuild/lib*.Native.so "$DST"/
          ls -lR "$DST"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native-out
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Smoke test: run ConsoleTest against the freshly built native wrapper plus
  # the FFmpeg libs restored from NuGet, on Windows x64 and Linux x64.
  # ---------------------------------------------------------------------------
  test:
    name: test ${{ matrix.rid }}
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download native wrapper (${{ matrix.rid }})
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: src/native-artifacts

      - name: Run ConsoleTest
        shell: bash
        run: |
          set -euo pipefail
          # Debug config: ProjectBuildProperties.targets disables GitVersion in Debug,
          # so the smoke test does not need full git history.
          dotnet run --project "$TEST_PROJ" -c Debug | tee out.txt
          grep -q "Exit" out.txt

  # ---------------------------------------------------------------------------
  # Pack the cross-platform NuGet package (all RIDs + managed lib).
  # ---------------------------------------------------------------------------
  pack:
    name: pack
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # GitVersion needs full history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download all native wrappers
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: src/native-artifacts
          merge-multiple: true

      - name: Pack
        run: dotnet pack "$LIB_PROJ" -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: out/*.nupkg
          if-no-files-found: error
